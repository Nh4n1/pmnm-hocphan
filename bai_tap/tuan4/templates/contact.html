{% extends "base.html" %}

{% block title %}Liên hệ{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Liên hệ với chúng tôi</h1>

    <p>Quán cà phê Trung Nguyên</p>
    <p>Địa chỉ: Số 1, đường ABC, quận XYZ, TP.HCM</p>
    <p>Giờ mở cửa: 7:00 - 22:00</p>

    <h3>Gửi thông tin liên hệ</h3>

    <form>
        <div class="mb-3">
            <label for="name" class="form-label">Họ và tên</label>
            <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                required
            >
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                required
            >
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Nội dung</label>
            <textarea
                class="form-control"
                id="message"
                name="message"
                rows="4"
                required
            ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Gửi liên hệ
        </button>
    </form>
</div>
{% endblock %}
