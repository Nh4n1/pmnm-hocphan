
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trang chủ</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light text-dark">
    <main class="container min-vh-100 d-flex justify-content-center align-items-center py-5">
        <div class="card shadow-sm border rounded-4 w-100" style="max-width: 600px;">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <p class="small text-secondary mb-2">FLASK APPLICATION</p>
                    <h1 class="fw-bold">Trang chủ</h1>
                    <p class="text-secondary">
                        Chọn chức năng bạn muốn sử dụng.
                    </p>
                </div>

                <div class="d-grid gap-3">
                    <a href="{{ url_for('calculator') }}"
                       class="btn btn-outline-dark btn-lg text-start">
                        <strong>01. Máy tính cơ bản</strong>
                        <div class="small text-secondary">
                            Cộng, trừ, nhân và chia
                        </div>
                    </a>

                    <a href="{{ url_for('tinh_diem_hoc_phan') }}"
                       class="btn btn-outline-dark btn-lg text-start">
                        <strong>02. Tính điểm học phần</strong>
                        <div class="small text-secondary">
                            Tính điểm tổng kết và xếp loại
                        </div>
                    </a>

                    <a href="{{ url_for('bmi_calculator_route') }}"
                       class="btn btn-outline-dark btn-lg text-start">
                        <strong>03. Tính chỉ số BMI</strong>
                        <div class="small text-secondary">
                            Tính BMI từ chiều cao và cân nặng
                        </div>
                    </a>
                </div>
            </div>

            <div class="card-footer bg-white text-center text-secondary py-3">
                <small>Built with Flask & Bootstrap</small>
            </div>
        </div>
    </main>
</body>
</html>
