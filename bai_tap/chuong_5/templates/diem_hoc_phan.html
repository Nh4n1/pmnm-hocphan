
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính điểm học phần</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light text-dark">
    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-5">
        <div class="card border rounded-4 shadow-sm bg-white w-100" style="max-width: 460px;">
            <div class="card-header bg-white border-bottom p-4">
                <p class="small text-secondary mb-2">ACADEMIC TOOLS / 01</p>
                <h1 class="h3 fw-bold mb-2">Tính điểm học phần</h1>
                <p class="text-secondary small mb-0">
                    Nhập điểm thành phần để tính kết quả cuối cùng.
                </p>
            </div>

            <div class="card-body p-4">
                <form action="/tinh-diem-hoc-phan" method="POST">
                    <div class="mb-4">
                        <label for="cc" class="form-label fw-semibold">
                            Điểm chuyên cần
                            <span class="text-secondary fw-normal">(10%)</span>
                        </label>
                        <input
                            type="text"
                            inputmode="decimal"
                            class="form-control py-2"
                            id="cc"
                            name="cc"
                            placeholder="0 – 10"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="gk" class="form-label fw-semibold">
                            Điểm giữa kỳ
                            <span class="text-secondary fw-normal">(30%)</span>
                        </label>
                        <input
                            type="text"
                            inputmode="decimal"
                            class="form-control py-2"
                            id="gk"
                            name="gk"
                            placeholder="0 – 10"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="ck" class="form-label fw-semibold">
                            Điểm cuối kỳ
                            <span class="text-secondary fw-normal">(60%)</span>
                        </label>
                        <input
                            type="text"
                            inputmode="decimal"
                            class="form-control py-2"
                            id="ck"
                            name="ck"
                            placeholder="0 – 10"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
                        Tính kết quả &rarr;
                    </button>
                </form>

                {% if error %}
                    <div class="alert alert-danger mt-4 mb-0" role="alert">
                        {{ error }}
                    </div>
                {% endif %}

                {% if diem_so is not none %}
                    <div class="border rounded-3 bg-light p-4 mt-4 text-center">
                        <p class="small text-secondary mb-1">ĐIỂM TỔNG KẾT</p>
                        <h2 class="display-4 fw-bold mb-2">{{ diem_so }}</h2>
                        <p class="small text-secondary mb-2">Xếp loại học phần</p>
                        <span class="badge bg-dark fs-6 px-3 py-2">
                            {{ diem_chu }}
                        </span>
                    </div>
                {% endif %}
            </div>

            <div class="card-footer bg-white text-secondary text-center small py-3">
                Weighted score: 10% · 30% · 60%
            </div>
        </div>
    </div>
</body>
</html>
