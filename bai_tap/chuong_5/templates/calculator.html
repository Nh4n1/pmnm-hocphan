<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Máy tính cơ bản</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light text-dark">
    <main class="container min-vh-100 d-flex justify-content-center align-items-center py-5">
        <div class="card shadow-sm border rounded-4 w-100"
             style="max-width: 600px;">

            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <p class="small text-secondary mb-2">
                        FLASK APPLICATION
                    </p>

                    <h1 class="fw-bold">Máy tính cơ bản</h1>

                    <p class="text-secondary mb-0">
                        Thực hiện các phép tính số học cơ bản
                    </p>
                </div>

                <form action="{{ url_for('calculator') }}" method="POST">
                    <div class="mb-3">
                        <label for="a" class="form-label fw-semibold">
                            Số thứ nhất
                        </label>

                        <input
                            type="text"
                            inputmode="decimal"
                            class="form-control form-control-lg"
                            id="a"
                            name="a"
                            placeholder="Nhập số thứ nhất"
                            value="{{ a if a is not none else '' }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="b" class="form-label fw-semibold">
                            Số thứ hai
                        </label>

                        <input
                            type="text"
                            inputmode="decimal"
                            class="form-control form-control-lg"
                            id="b"
                            name="b"
                            placeholder="Nhập số thứ hai"
                            value="{{ b if b is not none else '' }}"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="operation" class="form-label fw-semibold">
                            Phép tính
                        </label>

                        <select
                            class="form-select form-select-lg"
                            id="operation"
                            name="operation"
                            required
                        >
                            <option value="add"
                                {% if operation == 'add' %}selected{% endif %}>
                                Cộng (+)
                            </option>

                            <option value="subtract"
                                {% if operation == 'subtract' %}selected{% endif %}>
                                Trừ (-)
                            </option>

                            <option value="multiply"
                                {% if operation == 'multiply' %}selected{% endif %}>
                                Nhân (×)
                            </option>

                            <option value="divide"
                                {% if operation == 'divide' %}selected{% endif %}>
                                Chia (÷)
                            </option>
                        </select>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-outline-dark btn-lg">
                            Tính kết quả
                        </button>
                    </div>
                </form>

                {% if error %}
                    <div class="alert alert-danger rounded-3 mt-4 mb-0"
                         role="alert">
                        <strong>Lỗi!</strong> {{ error }}
                    </div>
                {% endif %}

                {% if result is not none %}
                    <div class="alert alert-success rounded-3 mt-4 mb-0"
                         role="status">
                        <div class="small text-uppercase fw-semibold mb-1">
                            Kết quả
                        </div>

                        <div class="fs-3 fw-bold">
                            {{ result }}
                        </div>
                    </div>
                {% endif %}
            </div>
        </div>
    </main>
</body>
</html>
